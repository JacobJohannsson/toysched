[project]
name = "toysched"
version = "0.1.0"
description = "Toy DAG scheduling simulator for practicing the RL query scheduler"
authors = [
    {name = "Jacob Johannsson",email = "jacob.johannsson@mail.utoronto.ca"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy (>=2.1,<3.0.0)",
    "gymnasium (>=1.0,<2.0)",
    "pyyaml (>=6.0,<7.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.4,<0.16.0)",
    "poethepoet (>=0.42.1,<0.43.0)",
    "pytest (>=8.0,<9.0)",
]

[tool.poe.tasks]
format = "ruff format"
lint = "ruff check"
fix = "ruff check --fix"
test = "pytest"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Pyflakes (`F`), pycodestyle (`E`), isort (`I`)
select = ["F", "E", "I", "W505"]
ignore = ["E741", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["toysched"]

[tool.ruff.lint.pycodestyle]
# Set the maximum allowed length for comments and docstrings
max-doc-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
